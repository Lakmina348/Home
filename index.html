<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Redirect - Lakmina King👑️</title>
    <style>
        :root {
            --bg-color: #05050a;
            --surface-color: #0c1021;
            --border-color: #1a233a;
            --text-primary: #00ffcc;
            --text-secondary: #8a99ad;
            --accent-glow: rgba(0, 255, 204, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .loader-container {
            text-align: center;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--text-primary);
            border-radius: 50%;
            animation: spin 0.5s linear infinite;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-size: 18px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        p {
            font-size: 13px;
            color: var(--text-secondary);
        }
    </style>
    <script>
        // මිලිතත්පර 1 කින් ස්වයංක්‍රීයව ලින්ක් එක විවෘත වේ
        setTimeout(function() {
            window.location.href = "https://lakmina348.github.io/Manuu__L-2026.08.05-S__Sanju/";
        }, 1);
    </script>
</head>
<body>
    <div class="loader-container">
        <div class="spinner"></div>
        <h2>පද්ධතිය වෙත ක්ෂණිකව පිවිසෙමින් පවතී...</h2>
        <p>කරුණාකර මොහොතක් රැඳී සිටින්න.</p>
    </div>
</body>
</html>
